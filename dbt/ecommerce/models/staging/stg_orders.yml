version: 2

models:
  - name: stg_orders
    description: "Cleaned and standardized order data."

    columns:

      - name: order_id
        description: "Unique identifier for the order."
        tests:
          - not_null
          - unique

      - name: order_date
        description: "Date when the order was created."
        tests:
          - not_null

      - name: customer_id
        description: "Unique identifier for the customer."
        tests:
          - not_null

      - name: product_id
        description: "Unique identifier for the product."
        tests:
          - not_null

      - name: quantity
        description: "Number of products ordered."
        tests:
          - not_null

      - name: unit_price
        description: "Price per product."
        tests:
          - not_null

      - name: status
        description: "Current order status."
        tests:
          - not_null